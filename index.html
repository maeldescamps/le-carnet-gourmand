<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Carnet Gourmand</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">
        👨‍🍳
    </div>

    <h1>Le Carnet Gourmand</h1>
    <p>Vos recettes préférées réunies au même endroit</p>
</header>


<main class="container">

    <h2>Bienvenue dans votre cuisine</h2>

    <p class="intro">
        Retrouvez des recettes sélectionnées avec soin.
    </p>


    <section class="categories">

        <div class="category">
            🍽️
            <span>Repas</span>
        </div>

        <div class="category">
            🍰
            <span>Desserts</span>
        </div>

        <div class="category">
            🥗
            <span>Entrées</span>
        </div>

        <div class="category">
            ☕
            <span>Boissons chaudes</span>
        </div>

        <div class="category">
            🥤
            <span>Boissons</span>
        </div>

        <div class="category">
            🥞
            <span>Bretagne</span>
        </div>

    </section>

</main>


<div class="assistant">
    👨‍🍳
</div>


</body>
</html>
